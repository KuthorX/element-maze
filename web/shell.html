<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta name="theme-color" content="#0B0B0B">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
/* Boot screen in the "Event Frame" art direction (docs/art-direction.md):
   near-black field, track-white outlines, grey static text, amber only for live values. */
:root {
	--field: #0B0B0B;
	--track: #EEEEE6;
	--grey: #8F8F8A;
	--amber: #F0A040;
	--mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
	background-color: var(--field);
}

body {
	color: var(--track);
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	background-color: var(--field);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	font-family: var(--mono);
	letter-spacing: 0.08em;
	z-index: 1;
	transition: opacity 0.25s ease-out;
}

#status.done {
	opacity: 0;
	pointer-events: none;
}

/* One hairline frame, like the in-game frame. */
#status::before {
	content: '';
	position: absolute;
	inset: 16px;
	border: 1px solid var(--grey);
	pointer-events: none;
}

#boot {
	width: min(560px, 80vw);
}

#boot-title {
	margin: 0 0 4px;
	font-size: clamp(20px, 4vw, 34px);
	font-weight: 700;
	text-transform: uppercase;
	letter-spacing: 0.18em;
	color: var(--track);
}

#boot-subtitle {
	margin: 0 0 36px;
	font-size: 13px;
	color: var(--grey);
}

/* Progress bar: a particle track. The amber ball advances along a grey hairline,
   leaving a trail of white bubbles behind it. */
#boot-bar {
	position: relative;
	height: 24px;
	margin: 8px 0 14px;
}

#boot-bar::before {
	content: '';
	position: absolute;
	left: 0;
	right: 0;
	top: 50%;
	border-top: 1px solid var(--grey);
	opacity: 0.5;
}

#boot-fill {
	position: absolute;
	top: 0;
	bottom: 0;
	left: 0;
	width: 0;
	background: radial-gradient(circle, transparent 2px, var(--track) 2px, var(--track) 3px, transparent 3.5px) 0 50% / 18px 24px repeat-x;
	transition: width 0.2s linear;
}

#boot-ball {
	position: absolute;
	top: 50%;
	left: 0;
	width: 16px;
	height: 16px;
	margin: -8px 0 0 -8px;
	border-radius: 50%;
	background: var(--amber);
	transition: left 0.2s linear;
}

#boot-bar.indeterminate #boot-fill {
	width: 0 !important;
}

#boot-bar.indeterminate #boot-ball {
	animation: sweep 1.6s ease-in-out infinite alternate;
}

@keyframes sweep {
	from { left: 0; }
	to { left: 100%; }
}

#boot-row {
	display: flex;
	justify-content: space-between;
	font-size: 13px;
	color: var(--grey);
}

#boot-pct, #boot-mb {
	color: var(--amber);
	font-variant-numeric: tabular-nums;
}

#boot-notice {
	display: none;
	margin-top: 20px;
	padding: 14px 16px;
	border: 1px solid var(--track);
	background: var(--field);
	color: var(--track);
	font-size: 13px;
	line-height: 1.5;
	letter-spacing: 0.02em;
	white-space: pre-wrap;
	word-break: break-word;
}

#boot-notice b {
	color: var(--amber);
	font-weight: 700;
}

#status.error #boot-bar, #status.error #boot-row {
	display: none;
}

#status.error #boot-notice {
	display: block;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="boot">
				<h1 id="boot-title">Guide The Ball</h1>
				<p id="boot-subtitle">引导小球</p>
				<div id="boot-bar" class="indeterminate"><div id="boot-fill"></div><div id="boot-ball"></div></div>
				<div id="boot-row">
					<span id="boot-label">Loading…</span>
					<span><span id="boot-pct"></span> <span id="boot-mb"></span></span>
				</div>
				<div id="boot-notice" role="alert"></div>
			</div>
		</div>

		<script>
// Runs before the engine script downloads so the loader text is correct from the first paint.
const BOOT_ZH = /^zh\b/i.test(navigator.language || '');
const BOOT_TEXT = BOOT_ZH ? {
	loading: '加载中…',
	starting: '启动中…',
	error: '加载失败',
	retry: '请刷新页面重试。',
} : {
	loading: 'Loading…',
	starting: 'Starting…',
	error: 'Failed to load',
	retry: 'Please reload the page to try again.',
};
document.documentElement.lang = BOOT_ZH ? 'zh' : 'en';
document.getElementById('boot-label').textContent = BOOT_TEXT.loading;
		</script>
		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const MB = 1024 * 1024;
	const statusOverlay = document.getElementById('status');
	const bar = document.getElementById('boot-bar');
	const fill = document.getElementById('boot-fill');
	const ball = document.getElementById('boot-ball');
	const label = document.getElementById('boot-label');
	const pct = document.getElementById('boot-pct');
	const mb = document.getElementById('boot-mb');
	const notice = document.getElementById('boot-notice');

	let initializing = true;

	function hideStatus() {
		if (!initializing) {
			return;
		}
		initializing = false;
		statusOverlay.classList.add('done');
		setTimeout(() => statusOverlay.remove(), 300);
	}

	function setProgress(current, total) {
		if (!initializing) {
			return;
		}
		if (current > 0 && total > 0) {
			const ratio = Math.min(current / total, 1);
			bar.classList.remove('indeterminate');
			fill.style.width = `${(ratio * 100).toFixed(1)}%`;
			ball.style.left = fill.style.width;
			pct.textContent = `${Math.floor(ratio * 100)}%`;
			mb.textContent = `${(current / MB).toFixed(1)} / ${(total / MB).toFixed(1)} MB`;
			label.textContent = ratio >= 1 ? BOOT_TEXT.starting : BOOT_TEXT.loading;
		} else {
			// Size unknown (no Content-Length, e.g. compressed transfer): sweep and show bytes only.
			bar.classList.add('indeterminate');
			pct.textContent = '';
			mb.textContent = current > 0 ? `${(current / MB).toFixed(1)} MB` : '';
		}
	}

	function displayFailureNotice(err) {
		console.error(err);
		let message = 'An unknown error occurred.';
		if (err instanceof Error) {
			message = err.message;
		} else if (typeof err === 'string') {
			message = err;
		}
		notice.textContent = '';
		const head = document.createElement('b');
		head.textContent = BOOT_TEXT.error;
		notice.appendChild(head);
		notice.appendChild(document.createTextNode(`\n${message}\n\n${BOOT_TEXT.retry}`));
		statusOverlay.classList.add('error');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'The following features required to run this game in the browser are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setProgress(0, 0);
		engine.startGame({
			'onProgress': setProgress,
		}).then(hideStatus, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
